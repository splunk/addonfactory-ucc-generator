name: docs
on:
  push:
    branches:
      - "main"
      - "develop"
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release/**"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: install deps
        uses: ./.github/actions/cached-ui-deps
      - name: Build Storybook
        run: |
          cd ui
          yarn run build-storybook --quiet --output-dir ../docs/storybook/
          cd ../
      - name: Deploy to GitHub Pages
        if: github.ref_name == 'main'
        run: python mkdocs.py gh-deploy --force --strict
      - name: Build Docs
        if: github.ref_name != 'main'
        run: python mkdocs.py build --strict
