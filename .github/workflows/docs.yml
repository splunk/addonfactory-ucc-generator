name: docs
on:
  push:
    branches:
      - "main"
      - "develop"
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release/**"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.9
      - name: install deps
        uses: ./.github/actions/cached-ui-deps
      - name: Build Storybook
        run: |
          cd ui
          yarn run build-storybook --quiet --output-dir ../docs/storybook/
          cd ../
      - name: Install docs tooling in a standalone venv
        run: |
          python -m venv .docs-venv
          .docs-venv/bin/pip install --upgrade pip
          .docs-venv/bin/pip install .
          .docs-venv/bin/pip install \
            'mkdocs~=1.6' \
            'mkdocs-material~=9.6' \
            'mkdocstrings[python]' \
            'mkdocs-print-site-plugin~=2.3'
      - name: Deploy to GitHub Pages
        if: github.ref_name == 'main'
        run: .docs-venv/bin/mkdocs gh-deploy --force --strict
      - name: Build Docs
        if: github.ref_name != 'main'
        run: .docs-venv/bin/mkdocs build --strict
