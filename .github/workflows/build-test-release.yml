name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  POETRY_VERSION: "2.1.4"

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      matrix_supportedSplunk: ${{ steps.matrix.outputs.supportedSplunk }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: splunk/addonfactory-test-matrix-action@v3.3

  fossa-scan:
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
          fossa analyze --debug
          fossa report attribution --format text --timeout 7200 > /tmp/THIRDPARTY
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: THIRDPARTY
          path: /tmp/THIRDPARTY
      - run: |
          fossa test --debug
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      - name: Check for failed steps for jobs with continue-on-error
        if: ${{ failure() }}
        run: echo "failed=true" >> $GITHUB_ENV

      - name: Set output if steps failed
        run: |
          echo "failed=${{ env.failed }}" >> $GITHUB_ENV
    outputs:
      failed: ${{ env.failed }}

  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: pre-commit/action@v3.0.1

  semgrep:
    uses: splunk/sast-scanning/.github/workflows/sast-scan.yml@main
    secrets:
      SEMGREP_KEY: ${{ secrets.SEMGREP_PUBLISH_TOKEN }}
    with:
      block_mode: "policy"

  compliance-copyrights:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: apache/skywalking-eyes@v0.9.0

  build-ui:
    name: Build UCC UI
    uses: ./.github/workflows/build-ui.yml

  storybook-screenshots:
    name: Update storybook screenshots
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/storybook-visual.yml
  bot-updates:
    name: Generates Documentation
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/automatic_doc_generation.yml
    with:
      python-version: "3.9"

  build:
    needs:
      - fossa-scan
      - build-ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: actions/download-artifact@v8
        with:
          name: UCC-UI-build
          path: built-ui/

      - uses: actions/download-artifact@v8
        if: "! github.event.pull_request.head.repo.fork "
        with:
          name: THIRDPARTY
      - run: cp -f THIRDPARTY NOTICE
        if: "! github.event.pull_request.head.repo.fork "
      - run: curl -sSL https://install.python-poetry.org | python3 - --version ${{env.POETRY_VERSION}}
      - run: poetry install
      - name: Build UCC
        run: |
          cp -R built-ui/. splunk_add_on_ucc_framework/package/appserver/static/js/build
          poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: UCC-build
          path: dist/

  test-unit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: curl -sSL https://install.python-poetry.org | python3 - --version ${{env.POETRY_VERSION}}
      - run: |
          poetry install
          poetry run pytest --cov=splunk_add_on_ucc_framework --cov-report=xml tests/unit
      - name: Check for failed steps for jobs with continue-on-error
        if: ${{ failure() }}
        run: echo "failed=true" >> $GITHUB_ENV

      - name: Set output if steps failed
        run: |
          echo "failed=${{ env.failed }}" >> $GITHUB_ENV
    outputs:
      failed: ${{ env.failed }}

  test-smoke:
    name: test-smoke ${{ matrix.python-version }}
    needs:
      - build-ui
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: UCC-UI-build
          path: built-ui/
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          cp -R built-ui/. splunk_add_on_ucc_framework/package/appserver/static/js/build
      - run: curl -sSL https://install.python-poetry.org | python3 - --version ${{env.POETRY_VERSION}}
      - run: |
          poetry install
          poetry run pytest tests/smoke
      - name: Check for failed steps for jobs with continue-on-error
        if: ${{ failure() }}
        run: echo "failed=true" >> $GITHUB_ENV

      - name: Set output if steps failed
        run: |
          echo "failed=${{ env.failed }}" >> $GITHUB_ENV
    outputs:
      failed: ${{ env.failed }}

  build-test-addon:
    runs-on: ubuntu-24.04
    needs:
      - build-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: actions/download-artifact@v8
        with:
          name: UCC-UI-build
          path: built-ui/
      - run: curl -sSL https://install.python-poetry.org | python3 - --version ${{env.POETRY_VERSION}}
      - run: |
          cp -R built-ui/. splunk_add_on_ucc_framework/package/appserver/static/js/build
          poetry install --only main
          poetry run pip install splunk-appinspect==4.3.0
      - run: poetry run ucc-gen build --source tests/testdata/test_addons/package_global_config_everything/package
      - run: ./scripts/include-rum.sh output/Splunk_TA_UCCExample/appserver/templates/base.html scripts/rum-script.html "$RUM_ACCESS_TOKEN"
        env:
          RUM_ACCESS_TOKEN: ${{ secrets.RUM_ACCESS_TOKEN}}
      - run: poetry run ucc-gen package --path output/Splunk_TA_UCCExample
      - run: poetry run ucc-gen validate --addon-path output/Splunk_TA_UCCExample
      - uses: actions/upload-artifact@v7
        with:
          name: Splunk_TA_UCCExample-raw-output
          path: output/*
      - uses: actions/upload-artifact@v7
        with:
          name: Splunk_TA_UCCExample-packaged
          path: Splunk_TA_UCCExample*.tar.gz

  build-openapi-client:
    name: Build UCC OpenAPI client for Kubernetes tests
    runs-on: ubuntu-24.04
    needs:
      - build-test-addon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: Splunk_TA_UCCExample-raw-output
          path: output/
      - name: Generate and install the OpenAPI client
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/local" openapitools/openapi-generator-cli:v7.13.0 generate \
            -i /local/output/Splunk_TA_UCCExample/appserver/static/openapi.json \
            -g python \
            -o /local/restapi_client
          mkdir openapi-client-libs
          python -m pip install --target openapi-client-libs ./restapi_client -r tests/ui/requirements.txt
          tar -czf openapi-client-libs.tar.gz openapi-client-libs
      - uses: actions/upload-artifact@v7
        with:
          name: UCC-openapi-client-libs
          path: openapi-client-libs.tar.gz

  setup-k8s-tests:
    name: Upload UCC test add-on to K8s test storage
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    needs:
      - build-test-addon
      - build-openapi-client
    permissions:
      contents: read
    outputs:
      addon-url: ${{ steps.upload.outputs.addon-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Splunk_TA_UCCExample-packaged
          path: package/
      - uses: actions/download-artifact@v8
        with:
          name: UCC-openapi-client-libs
          path: package/openapi-client-libs/
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
      - name: Upload packaged add-on
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          package_file=$(find package -maxdepth 1 -type f -name 'Splunk_TA_UCCExample*.tar.gz' -print -quit)
          client_libs_file=$(find package/openapi-client-libs -maxdepth 1 -type f -name 'openapi-client-libs.tar.gz' -print -quit)
          test -n "$package_file"
          test -n "$client_libs_file"
          destination="s3://ta-production-artifacts/ta-apps/ucc/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${package_file##*/}"
          aws s3 cp "$package_file" "$destination" --only-show-errors
          client_libs_destination="${destination%/*}/libs_${package_file##*/}.tgz"
          aws s3 cp "$client_libs_file" "$client_libs_destination" --only-show-errors
          echo "addon-url=$destination" >> "$GITHUB_OUTPUT"

  test-ui:
    name: test-ui K8s Splunk ${{ matrix.splunk.version }}
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    needs:
      - meta
      - setup-k8s-tests
      - test-unit
      - build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/splunk/workflow-engine-base:4.1.0
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        splunk: ${{ fromJson(needs.meta.outputs.matrix_supportedSplunk) }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
      - name: Read Argo token from AWS Secrets Manager
        id: get-argo-token
        run: |
          token=$(aws secretsmanager get-secret-value --secret-id ta-github-workflow-automation-token | jq -r '.SecretString')
          echo "argo-token=$token" >> "$GITHUB_OUTPUT"
      - name: Create unique Argo job name
        id: create-job-name
        shell: bash
        run: |
          job_name="ucc-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.splunk.version }}"
          job_name=${job_name//./-}
          echo "job-name=$job_name" >> "$GITHUB_OUTPUT"
      - name: Run UCC UI tests in Kubernetes
        timeout-minutes: 340
        env:
          ARGO_SERVER: argo.wfe.splgdi.com:443
          ARGO_HTTP1: "true"
          ARGO_SECURE: "true"
          ARGO_BASE_HREF: ""
          ARGO_NAMESPACE: workflows
          ARGO_TOKEN: ${{ steps.get-argo-token.outputs.argo-token }}
        uses: splunk/wfe-test-runner-action@v5.3
        with:
          splunk: ${{ matrix.splunk.version }}${{ secrets.OTHER_TA_REQUIRED_CONFIGS }}
          test-type: ui
          test-args: ""
          job-name: ${{ steps.create-job-name.outputs.job-name }}
          labels: addon-name=ucc-generator
          workflow-tmpl-name: ucc-workflow
          workflow-template-ns: workflows
          addon-url: ${{ needs.setup-k8s-tests.outputs.addon-url }}
          addon-name: Splunk_TA_UCCExample
          k8s-manifests-branch: main
          test-browser: chrome
          python-version: "3.13"

  test-openapi-client:
    name: test-openapi-client K8s Splunk ${{ matrix.splunk.version }}
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/splunk/workflow-engine-base:4.1.0
    permissions:
      contents: read
      checks: write
    needs:
      - meta
      - setup-k8s-tests
      - build-openapi-client
      - build
      - test-unit
    strategy:
      fail-fast: false
      matrix:
        splunk: ${{ fromJson(needs.meta.outputs.matrix_supportedSplunk) }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
      - name: Read Argo token from AWS Secrets Manager
        id: get-argo-token
        run: |
          token=$(aws secretsmanager get-secret-value --secret-id ta-github-workflow-automation-token | jq -r '.SecretString')
          echo "argo-token=$token" >> "$GITHUB_OUTPUT"
      - name: Create unique Argo job name
        id: create-job-name
        shell: bash
        run: |
          job_name="ucc-openapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.splunk.version }}"
          job_name=${job_name//./-}
          echo "job-name=$job_name" >> "$GITHUB_OUTPUT"
      - name: Run UCC OpenAPI client tests in Kubernetes
        timeout-minutes: 340
        env:
          ARGO_SERVER: argo.wfe.splgdi.com:443
          ARGO_HTTP1: "true"
          ARGO_SECURE: "true"
          ARGO_BASE_HREF: ""
          ARGO_NAMESPACE: workflows
          ARGO_TOKEN: ${{ steps.get-argo-token.outputs.argo-token }}
        uses: splunk/wfe-test-runner-action@v5.3
        with:
          splunk: ${{ matrix.splunk.version }}${{ secrets.OTHER_TA_REQUIRED_CONFIGS }}
          test-type: ucc_openapi_client
          test-args: ""
          job-name: ${{ steps.create-job-name.outputs.job-name }}
          labels: addon-name=ucc-generator
          workflow-tmpl-name: ucc-workflow
          workflow-template-ns: workflows
          addon-url: ${{ needs.setup-k8s-tests.outputs.addon-url }}
          addon-name: Splunk_TA_UCCExample
          k8s-manifests-branch: main
          python-version: "3.13"

  appinspect-for-expected-outputs:
    name: splunk-appinspect ${{ matrix.tags }} tests/testdata/expected_addons/expected_output_global_config_everything/Splunk_TA_UCCExample
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        tags:
          - "cloud"
          - "appapproval"
          - "deprecated_feature"
          - "developer_guidance"
          - "future"
          - "self-service"
          - "splunk_appinspect"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: curl -sSL https://install.python-poetry.org | python3 - --version ${{env.POETRY_VERSION}}
      - name: Package tests/expected_output_global_config_everything/Splunk_TA_UCCExample
        run: |
          poetry install
          mkdir tests/packaged
          poetry run ucc-gen package --path tests/testdata/expected_addons/expected_output_global_config_everything/Splunk_TA_UCCExample -o tests/packaged
      - uses: splunk/appinspect-cli-action@v2.15
        with:
          app_path: tests/packaged
          included_tags: ${{ matrix.tags }}
          appinspect_manual_checks: tests/testdata/expected_addons/expected_output_global_config_everything/.appinspect.manualcheck.yaml
          appinspect_expected_failures: tests/testdata/expected_addons/expected_output_global_config_everything/.appinspect.expect.yaml

  appinspect-api:
    name: appinspect api ${{ matrix.tags }}
    needs: build-test-addon
    if: |
      !cancelled() &&
      needs.build-test-addon.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tags:
          - "cloud"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Splunk_TA_UCCExample-packaged
          path: build/package
      - name: Copy .appinspect_api.expect.yaml to Working Directory
        run: |
            cp tests/testdata/expected_addons/expected_output_global_config_everything/.appinspect_api.expect.yaml ./.appinspect_api.expect.yaml
      - uses: splunk/appinspect-api-action@v3.0
        with:
          username: ${{secrets.SPL_COM_USER}}
          password: ${{secrets.SPL_COM_PASSWORD}}
          app_path: build/package
          included_tags: ${{ matrix.tags }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appinspect-api-html-report-${{ matrix.tags }}
          path: AppInspect_response.html

  all-checks:
    if: ${{ !cancelled() }}
    needs:
      - test-unit
      - test-smoke
      - build-openapi-client
      - test-ui
      - test-openapi-client
      - storybook-screenshots
      - bot-updates
    runs-on: ubuntu-24.04
    env:
      NEEDS: ${{ toJson(needs) }}
    steps:
      - name: check if tests have passed
        id: check
        shell: bash
        run: |
          IS_FORK="${{ github.event.pull_request.head.repo.fork == true }}"
          ALL_JOBS_PASSED=$(echo "$NEEDS" | jq --arg is_fork "$IS_FORK" '((."test-ui".result == "success" and ."test-openapi-client".result == "success") or ($is_fork == "true" and ."test-ui".result == "skipped" and ."test-openapi-client".result == "skipped")) and (del(."test-ui", ."test-openapi-client") | all(.[]; .result == "success" and (.outputs.failed // "false") != "true"))')
          if [[ "$ALL_JOBS_PASSED" == "true" ]]
          then
              echo "all-checks=true" >> "$GITHUB_OUTPUT"
          else
              echo "all-checks=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail job if something failed
        if: ${{ steps.check.outputs.all-checks == 'false' }}
        run: |
          echo "Some check failed"
          exit 1

  release:
    needs:
      - build
      - compliance-copyrights
      - fossa-scan
      - test-unit
      - test-smoke
      - test-ui
      - test-openapi-client
      - appinspect-for-expected-outputs
      - semgrep
      - pre-commit
      - all-checks
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    if: "! github.event.pull_request.head.repo.fork "
    steps:
      - uses: actions/checkout@v7
        with:
          # Very important: semantic-release won't trigger a tagged
          # build if this is not set false
          persist-credentials: false
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: install UI deps
        uses: ./.github/actions/cached-ui-deps
      - run: curl -sSL https://install.python-poetry.org | python3 - --version ${{env.POETRY_VERSION}}
      - uses: actions/download-artifact@v8
        with:
          name: UCC-UI-build
          path: built-ui/
      - uses: actions/download-artifact@v8
        with:
          name: THIRDPARTY
      - run: cp -f THIRDPARTY NOTICE
      - run: poetry install
      - name: Copy built UCC UI into UCC generator folder
        run: |
          cp -R built-ui/. splunk_add_on_ucc_framework/package/appserver/static/js/build
      - id: semantic
        uses: splunk/semantic-release-action@v1.3
        with:
          git_committer_name: ${{ secrets.SA_GH_USER_NAME }}
          git_committer_email: ${{ secrets.SA_GH_USER_EMAIL }}
          gpg_private_key: ${{ secrets.SA_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.SA_GPG_PASSPHRASE }}
          extra_plugins: |
            semantic-release-replace-plugin
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - if: ${{ steps.semantic.outputs.new_release_published == 'true' }}
        run: |
          poetry build
          poetry publish -n -u ${{ secrets.PYPI_USERNAME }} -p ${{ secrets.PYPI_TOKEN }}
      - if: ${{ steps.semantic.outputs.new_release_published == 'true' }}
        name: Configure npm registry auth
        uses: actions/setup-node@v7
        with:
          node-version-file: 'ui/package.json'
          registry-url: 'https://registry.npmjs.org'
      - if: ${{ steps.semantic.outputs.new_release_published == 'true' }}
        name: Publish NPM
        run: |
          cd ui
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
